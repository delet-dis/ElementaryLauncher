name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Unit tests, release lint, and release bundle
        run: ./gradlew testDebugUnitTest lintRelease bundleRelease --warning-mode fail
