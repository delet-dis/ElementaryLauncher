name: Scan with Detekt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Detekt 1.23.8
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/detekt-cli.jar" \
            "https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar"
          java -jar "${RUNNER_TEMP}/detekt-cli.jar" \
            --input "${GITHUB_WORKSPACE}/app/src" \
            --config "${GITHUB_WORKSPACE}/config/detekt/detekt.yml" \
            --report "sarif:${GITHUB_WORKSPACE}/detekt.sarif.json"

      - name: Upload Detekt SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: detekt.sarif.json
