def uploadStoreFile = providers.gradleProperty("ELEMENTARY_UPLOAD_STORE_FILE")
    .orElse(providers.environmentVariable("ELEMENTARY_UPLOAD_STORE_FILE"))
def uploadStorePassword = providers.gradleProperty("ELEMENTARY_UPLOAD_STORE_PASSWORD")
    .orElse(providers.environmentVariable("ELEMENTARY_UPLOAD_STORE_PASSWORD"))
def uploadKeyAlias = providers.gradleProperty("ELEMENTARY_UPLOAD_KEY_ALIAS")
    .orElse(providers.environmentVariable("ELEMENTARY_UPLOAD_KEY_ALIAS"))
def uploadKeyPassword = providers.gradleProperty("ELEMENTARY_UPLOAD_KEY_PASSWORD")
    .orElse(providers.environmentVariable("ELEMENTARY_UPLOAD_KEY_PASSWORD"))
def hasReleaseSigning = uploadStoreFile.isPresent() &&
    uploadStorePassword.isPresent() &&
    uploadKeyAlias.isPresent() &&
    uploadKeyPassword.isPresent()

